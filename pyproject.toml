[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stp"
version = "0.2.0"
description = "面向结构化任务协议的双模式智能体编排框架（研究原型）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "openai>=1.40",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stp-demo = "stp.demo.accounting:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["stp*"]
